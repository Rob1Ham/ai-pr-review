[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-review"
version = "0.1.0"
description = "Resumable, evidence-led multi-model pull request review campaigns"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-pr-review = "ai_pr_review.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
